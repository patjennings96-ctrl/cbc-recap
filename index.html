<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1015; --card:#161b23; --card2:#1c232d; --line:#283140;
  --ink:#eaeef4; --muted:#8a95a6; --accent:#c8f560; --money:#ffd166;
  --win:#4ade80; --loss:#f87171; --cool:#60a5fa;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
h1,h2,.big,.num{font-family:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;letter-spacing:.02em}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.bar select,.bar button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
.bar button{cursor:pointer}.bar button:hover{border-color:var(--accent)}
.bar .sp{flex:1}
header.hero{border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:22px}
.hero .kicker{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12px}
.hero h1{font-size:clamp(44px,9vw,84px);line-height:.92;margin:4px 0 6px;text-transform:uppercase;font-weight:800}
.hero .headline{font-size:clamp(17px,2.6vw,22px);font-weight:600;margin:8px 0 6px;max-width:820px}
.hero .sub{color:var(--muted)}
section{margin-top:30px}
h2{font-size:26px;text-transform:uppercase;margin:0 0 4px;font-weight:700}
h2 small{font:500 12px Inter,sans-serif;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:8px}
.note{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.muted{color:var(--muted)} .win{color:var(--win)} .loss{color:var(--loss)} .acc{color:var(--accent)} .gold{color:var(--money)}
.av{width:28px;height:28px;border-radius:50%;background:var(--card2);object-fit:cover;flex:none}
.team{display:flex;align-items:center;gap:8px;min-width:0}
.team b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.team span.o{display:block;color:var(--muted);font-size:11.5px}
.ed{border-bottom:1px dashed transparent;outline:0;border-radius:3px}
.ed:hover{border-bottom-color:var(--muted)} .ed:focus{background:var(--card2);border-bottom-color:var(--accent)}
.money{background:linear-gradient(135deg,#2a2410,#161b23 60%);border-color:#5b4a14;display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.money .big{font-size:40px;font-weight:800;line-height:1}
.money .mid{text-align:center}.money .mid .big{color:var(--money);font-size:54px}
.money .r{text-align:right}.money .r .team{justify-content:flex-end}
@media(max-width:620px){.money{grid-template-columns:1fr}.money .r,.money .mid{text-align:left}.money .r .team{justify-content:flex-start}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
.mu{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.mu .num{font-size:26px;font-weight:700}
.mu .lose{opacity:.55}
.quip{font-size:12.5px;color:var(--muted);margin-top:8px;font-style:italic}
.tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:5px;background:var(--card2);color:var(--muted);margin:0 4px 6px 0}
.tag.hot{background:#3b1d1d;color:#fca5a5}.tag.acc{background:#2a3511;color:var(--accent)}.tag.gold{background:#3a2f0d;color:var(--money)}.tag.cool{background:#152a44;color:#93c5fd}
.award .lab{color:var(--accent);font-weight:700}
.award .v{font-size:16px;font-weight:600;margin:3px 0}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}.tbl .c{text-align:center}
.tbl .num{font-size:18px;font-weight:700}
.scroll{overflow-x:auto}
.pbar{height:8px;border-radius:4px;background:var(--card2);min-width:90px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.spark{display:block}
.mx td,.mx th{text-align:center;padding:6px 5px;font-variant-numeric:tabular-nums}
.mx td.t{text-align:left;white-space:nowrap;font-weight:600}
.mx td.self{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
.mx td.up{background:rgba(74,222,128,.16)} .mx td.dn{background:rgba(248,113,113,.16)}
.prev .row{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center;margin:6px 0}
.prev .pct{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;text-align:right}
.prev .split{height:6px;border-radius:3px;background:var(--cool);overflow:hidden;margin:8px 0}
.prev .split i{display:block;height:100%;background:var(--accent)}
.prev .sw{font-size:12px;color:var(--muted)}
.prev .hist{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.trade .side{margin-top:8px}.trade .side b{font-weight:600}
details{margin-top:12px} summary{cursor:pointer;color:var(--muted);font-size:13px}
ul.plain{list-style:none;margin:0;padding:0} ul.plain li{padding:6px 0;border-bottom:1px solid var(--line)} ul.plain li:last-child{border:0}
#status{padding:40px 0;text-align:center;color:var(--muted)}
#status button{margin-top:12px;background:var(--accent);color:#111;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
@media print{.bar{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <select id="leagueSel" title="League"></select>

    <button id="reBtn">Refresh</button>

  <div id="status">Loading from Sleeper…</div>
  <div id="app"></div>
  <footer>Data: Sleeper public API · Odds are simulations, not promises · Dashed-underlined text is editable and saved in this browser.</footer>
</div>

const ktcNorm = s => String(s).toLowerCase().replace(/[.'\u2019]/g, '').replace(/\s+(jr|sr|ii|iii|iv)$/, '').replace(/[^a-z0-9]/g, '');
const KTCV = {}; KTC.raw.split(';').forEach(e => { const i = e.lastIndexOf('|'); KTCV[ktcNorm(e.slice(0, i))] = +e.slice(i + 1); });

const BASE = 'https://api.sleeper.app/v1';
const qs = new URLSearchParams(location.search);
let DEMO = qs.has('demo');
const SHOW = CONFIG.show;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const f2 = n => (Math.round(n * 100) / 100).toFixed(2);
const pct = p => p >= .995 ? '>99%' : p > 0 && p < .005 ? '<1%' : Math.round(p * 100) + '%';
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const ord = n => n + (['th','st','nd','rd'][(n % 100 > 10 && n % 100 < 14) ? 0 : n % 10] || 'th');
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };

async function api(path){
  if (DEMO) return demoApi(path);
  const r = await fetch(BASE + path);
  if (!r.ok) throw new Error('Sleeper returned ' + r.status + ' for ' + path);
  return r.json();
}

let G = { state:null, leagues:[], usersBy:{}, D:null, players:null, hist:{}, simCache:{}, curW:null, text:() => '' };

/* ---------------- load ---------------- */
async function init(){
  $('app').innerHTML = ''; $('status').style.display = ''; $('status').textContent = 'Loading from Sleeper…'; G.simCache = {};
  try {
    G.state = await api('/state/nfl');
    const season = G.state.league_season || G.state.season;
    const forced = qs.get('league') || CONFIG.leagueId;
    if (forced) {
      G.leagues = [await api('/league/' + forced)];
    } else {
      const user = await api('/user/' + encodeURIComponent(qs.get('user') || CONFIG.username));
      if (!user || !user.user_id) throw new Error('Sleeper user "' + CONFIG.username + '" not found');
      G.me = user.user_id;
      G.leagues = await api(`/user/${user.user_id}/leagues/nfl/${season}`) || [];

async function loadLeague(id){

  const league = G.leagues.find(l => l.league_id === id);
  const s = league.settings || {};

  const weeks = []; for (let w = start; w <= regEnd; w++) weeks.push(w);
  const txWeeks = []; for (let w = 1; w <= Math.min(18, Math.max(G.state.week || 1, 1) + 1); w++) txWeeks.push(w);

    Promise.all(txWeeks.map(w => soft(`/league/${id}/transactions/${w}`)))

      fpts: r.settings && r.settings.fpts ? r.settings.fpts + (r.settings.fpts_decimal || 0) / 100 : 0, taxi: new Set(r.taxi || []) };
  });

async function loadPlayers(){

/* Walks back through previous seasons of this league (they never change, so they're cached in this browser). */

      for (let w = a; w <= b; w++) wk.push(w);
      const [users, rosters, mus] = await Promise.all([api(`/league/${pid}/users`), api(`/league/${pid}/rosters`), Promise.all(wk.map(w => api(`/league/${pid}/matchups/${w}`).catch(() => [])))]);

/* Best possible lineup each week vs. the one actually set. */
function coach(W){
  const D = G.D; if (!G.players || !D.slots.length) return null;
  const C = {}; D.teams.forEach(t => C[t.rid] = { rid: t.rid, left:0, opt:0, act:0, cost:0, wk:{} });
  const pos = id => (G.players[id] || [])[1] || (/^[A-Z]{2,3}$/.test(id) ? 'DEF' : '');
  for (let w = D.start; w <= W; w++) {
    Object.values(D.raw[w] || {}).forEach(m => { const c = C[m.roster_id]; if (!c || !(m.points > 0)) return;
      const pp = m.players_points || {}, st = new Set(m.starters || []), taxi = D.T[m.roster_id].taxi;
      const pool = (m.players || Object.keys(pp)).filter(id => st.has(id) || !taxi.has(id)).map(id => ({ id, p: +pp[id] || 0, pos: pos(id) })).sort((a, b) => b.p - a.p);

function history(W){

  const cur = String(D.league.season), games = [], names = {};
  [...past].reverse().forEach(s => { Object.assign(names, s.names); s.games.forEach(g => games.push({ season: s.season, w: g[0], a: g[1], pa: g[2], b: g[3], pb: g[4] })); });
  D.teams.forEach(t => names[t.oid] = t.name);

        const oa = D.T[a].oid, ob = D.T[b].oid, r = H.h2h[[oa, ob].sort().join('|')]; if (!r) return '<div class="hist">First-ever meeting.</div>';

        return `<div class="hist">All-time: ${wa === wb ? `series tied ${wa}–${wb}` : `<b>${esc(name(wa > wb ? a : b))}</b> leads ${Math.max(wa, wb)}–${Math.min(wa, wb)}`} <span class="muted">(${r.n} meeting${r.n > 1 ? 's' : ''}, ${H.span})</span></div>`; };
      T.push(`👀 WEEK ${NW} PREVIEW`);
      h += `<section><h2>Week ${NW} Preview</h2><p class="note">Win chance comes from the same simulation. "Win → / Lose →" shows each team's playoff odds depending on this week's result — the bigger the gap, the more this game matters.${D.median ? ' Each team also plays the median, so a loss here isn\'t always an 0-fer.' : ''}</p><div class="grid g2">` +
      ng.map((g, i) => { const pa = sim[g.a].pWin ?? .5;
        const row = r => `<div class="row"><div>${teamHTML(r, `${rec(S[r])} · ${f1(S[r].avg)}/wk · #${S[r].rank} power`)}</div><div class="pct">${pct(sim[r].pWin ?? .5)}</div></div>
          <div class="sw">${stakeTag(r)}Playoffs ${pct(sim[r].po)} · Win → <b class="win">${pct(sim[r].ifW ?? sim[r].po)}</b> · Lose → <b class="loss">${pct(sim[r].ifL ?? sim[r].po)}</b></div>`;
        const mw = [g.a, g.b].filter(r => sim[r].lev >= .15 && sim[r].po < .5).map(name);
        T.push(`${name(g.a)} (${pct(pa)}) vs ${name(g.b)} (${pct(1 - pa)})${i === 0 ? ' ⭐ Game of the Week' : ''}${mw.length ? ' — MUST WIN: ' + mw.join(' & ') : ''}`);
        return `<div class="card prev">${i === 0 ? '<span class="tag acc">Game of the week</span>' : ''}${Math.abs(pa - .5) < .05 ? '<span class="tag">Coin flip</span>' : ''}${row(g.a)}<div class="split"><i style="width:${Math.round(pa * 100)}%"></i></div>${row(g.b)}${rivalry(g.a, g.b)}</div>`; }).join('') + `</div></section>`;
    } else h += `<section><h2>Up Next</h2><div class="card">The regular season is done — playoffs start Week ${D.regEnd + 1}.</div></section>`;
  }

  /* --- power rankings --- */
  if (SHOW.powerRankings) {
    const maxPts = Math.max(...ranked.flatMap(s => s.wk.map(x => x.pts)), 1);
    h += `<section><h2>Power Rankings &amp; Trends</h2><p class="note">Ranked on scoring average (50%), last three weeks (30%) and all-play record (20%). Luck = actual head-to-head wins minus the wins you'd expect from your scores.</p>
    <div class="card scroll"><table class="tbl"><tr><th>#</th><th></th><th>Team</th><th class="c">Record</th><th class="r">Avg</th><th>Week by week</th><th class="r">Last 3 vs avg</th><th class="c">Streak</th><th class="c">All-play</th><th class="r">Luck</th></tr>` +
    ranked.map(s => { const p = prev && prev[s.rid] && prev[s.rid].rank, mv = p ? p - s.rank : 0;
      const mvH = !p || !mv ? '<span class="muted">–</span>' : mv > 0 ? `<span class="win">▲${mv}</span>` : `<span class="loss">▼${-mv}</span>`;
      const fm = s.g >= 4 ? `<span class="${s.form > 3 ? 'win' : s.form < -3 ? 'loss' : 'muted'}">${s.form > 0 ? '+' : ''}${f1(s.form)}</span>` : '<span class="muted">—</span>';
      return `<tr><td class="num">${s.rank}</td><td>${mvH}</td><td>${teamHTML(s.rid)}</td><td class="c">${rec(s)}</td><td class="r">${f1(s.avg)}</td><td>${spark(s, maxPts)}</td><td class="r">${fm}</td><td class="c ${s.streak[0] === 'W' ? 'win' : s.streak[0] === 'L' ? 'loss' : ''}">${s.streak}</td><td class="c">${s.apW}-${s.apL}</td><td class="r ${s.luck > .5 ? 'win' : s.luck < -.5 ? 'loss' : 'muted'}">${s.luck > 0 ? '+' : ''}${f1(s.luck)}</td></tr>`; }).join('') + `</table></div></section>`;
    const hot = ranked.filter(s => s.g >= 4).sort((a, b) => b.form - a.form);
    T.push('📈 POWER RANKINGS'); ranked.forEach(s => T.push(`${s.rank}. ${name(s.rid)} (${rec(s)}, ${f1(s.avg)}/wk)`)); T.push('');
    if (hot.length) T.push(`🔥 Heating up: ${name(hot[0].rid)} (${hot[0].form > 0 ? '+' : ''}${f1(hot[0].form)} vs season avg)`, `🧊 Cooling off: ${name(hot[hot.length - 1].rid)} (${f1(hot[hot.length - 1].form)})`, '');
  }

  /* --- trophy case --- */
  if (SHOW.trophyCase) {
    const cols = [['🏆', 'hiW', 'Weekly high score'], ['🚽', 'loW', 'Weekly low score'], ['🍀', 'lucky', 'Won while scoring below the median'], ['💔', 'tough', 'Lost while scoring above the median'], ['💥', 'blow', 'Wins by 40+'], ['😬', 'heart', 'Losses by under 5']];
    const rows = ranked.slice().sort((a, b) => (b.hiW - b.loW) - (a.hiW - a.loW) || b.pf - a.pf);
    h += `<section><h2>Trophy &amp; Toilet Case <small>season tallies</small></h2><p class="note">${cols.map(c => `${c[0]} ${c[2].toLowerCase()}`).join(' · ')}</p>
      <div class="card scroll"><table class="tbl"><tr><th>Team</th>${cols.map(c => `<th class="c" title="${c[2]}">${c[0]}</th>`).join('')}</tr>` +
      rows.map(s => `<tr><td>${teamHTML(s.rid)}</td>${cols.map(c => `<td class="c ${s[c[1]] ? '' : 'muted'}">${s[c[1]] || '·'}</td>`).join('')}</tr>`).join('') + `</table></div></section>`;
  }

  /* --- schedule luck --- */
  if (SHOW.scheduleLuck) {
    const M = schedLuck(W), rs = ranked.map(s => s.rid);
    h += `<section><h2>Schedule Luck <small>what if you'd had someone else's schedule?</small></h2><p class="note">Each row is a team; each column is a schedule. The number is that team's head-to-head wins if it had played that schedule (the outlined box is the real one). Green = they'd have more wins, red = fewer.${D.median ? ' Median games aren\'t affected by schedule, so they\'re left out.' : ''}</p>
      <div class="card scroll"><table class="tbl mx"><tr><th style="text-align:left">Team ↓ / Schedule →</th>${rs.map(j => `<th title="${esc(name(j))}'s schedule">${esc(abbr(D.T[j]))}</th>`).join('')}<th>Best</th><th>Worst</th></tr>` +
      rs.map(i => { const row = rs.map(j => M[i][j]), act = M[i][i];
        return `<tr><td class="t">${esc(name(i))}</td>${rs.map(j => `<td class="${i === j ? 'self' : M[i][j] > act ? 'up' : M[i][j] < act ? 'dn' : ''}">${M[i][j] % 1 ? f1(M[i][j]) : M[i][j]}</td>`).join('')}<td class="win">${Math.max(...row)}</td><td class="loss">${Math.min(...row)}</td></tr>`; }).join('') + `</table></div></section>`;
  }

  /* --- playoff + title odds --- */
  const left = D.regEnd - W;
  const seeds = seedOrder(D.teams.map(t => ({ rid: t.rid, wv: S[t.rid].winval, pf: S[t.rid].pf, div: t.div })), D);
  const seedOf = Object.fromEntries(seeds.map((x, i) => [x.rid, i + 1]));
  if (SHOW.playoffOdds) {
    const od = D.teams.map(t => t.rid).sort((a, b) => sim[b].po - sim[a].po || seedOf[a] - seedOf[b]), TO = SHOW.titleOdds;
    h += `<section><h2>Playoff${TO ? ' &amp; Title' : ''} Odds <small>${CONFIG.sims.toLocaleString()} simulated seasons</small></h2><p class="note">${left ? `${left} week${left > 1 ? 's' : ''} left. Each remaining game is simulated from every team's scoring so far (pulled toward league average early in the year), then seeded by record with points-for as the tiebreak.` : 'Regular season is complete.'}${TO ? ' The bracket is then played out as single-game rounds.' : ''}</p>
    <div class="card scroll"><table class="tbl"><tr><th>Team</th><th class="c">Seed now</th><th class="c">Record</th><th class="r">PF</th><th class="r">Proj. wins</th><th colspan="2">Make playoffs</th>${sim._byes ? '<th class="r">Bye</th>' : ''}${TO ? '<th class="r">Reach final</th><th class="r">Win title</th>' : ''}</tr>` +
    od.map(r => `<tr><td>${teamHTML(r)}</td><td class="c">${seedOf[r]}</td><td class="c">${rec(S[r])}</td><td class="r">${f1(S[r].pf)}</td><td class="r">${f1(sim[r].wins)}</td><td class="num r" style="width:64px">${pct(sim[r].po)}</td><td><div class="pbar"><i style="width:${Math.round(sim[r].po * 100)}%"></i></div></td>${sim._byes ? `<td class="r">${pct(sim[r].bye)}</td>` : ''}${TO ? `<td class="r">${pct(sim[r].fin)}</td><td class="r num gold">${pct(sim[r].champ)}</td>` : ''}</tr>`).join('') + `</table></div></section>`;
    T.push(`🎲 PLAYOFF ODDS${TO ? ' (title odds)' : ''}`); od.forEach(r => T.push(`${name(r)}: ${pct(sim[r].po)}${TO ? ` (${pct(sim[r].champ)})` : ''}`)); T.push('');
  }

  /* --- race for the 1.01 --- */
  if (SHOW.draftRace) {
    const ns = String(+D.league.season + 1), rounds = (D.league.settings || {}).draft_rounds || 4, own = {};
    D.teams.forEach(t => { own[t.rid] = {}; for (let r = 1; r <= rounds; r++) own[t.rid][r] = t.rid; });
    D.picks.filter(p => String(p.season) === ns && own[p.roster_id] && p.round <= rounds).forEach(p => own[p.roster_id][p.round] = p.owner_id);
    const held = {}; D.teams.forEach(t => held[t.rid] = { r1: 0, n: 0 });
    Object.values(own).forEach(o => Object.entries(o).forEach(([r, w]) => { if (held[w]) { held[w].n++; if (+r === 1) held[w].r1++; } }));
    const rows = D.teams.map(t => t.rid).sort((a, b) => sim[b].p1 - sim[a].p1 || sim[b].top3 - sim[a].top3 || sim[a].maxpf - sim[b].maxpf);
    h += `<section><h2>Race for the 1.01 <small>${ns} rookie draft</small></h2><p class="note">Draft order goes by max points-for: of the teams that miss the playoffs, the lowest max PF picks first. Odds come from the same simulation, projecting each team's max PF forward. Pick ownership reflects trades to date.</p>
      <div class="card scroll"><table class="tbl"><tr><th>Team</th><th class="c">Record</th><th class="r">Max PF</th><th class="r">1.01 odds</th><th class="r">Top-3 pick</th><th>Their ${ns} 1st belongs to</th><th class="c">${ns} 1sts held</th><th class="c">${ns} picks held</th></tr>` +
      rows.map(r => { const o = own[r][1], tr = o !== r;
        return `<tr><td>${teamHTML(r)}</td><td class="c">${rec(S[r])}</td><td class="r">${f1(sim[r].maxpf)}</td><td class="r num">${pct(sim[r].p1)}</td><td class="r">${pct(sim[r].top3)}</td><td class="${tr ? 'gold' : 'muted'}">${tr ? '→ ' + esc(name(o)) : 'Themselves'}</td><td class="c ${held[r].r1 > 1 ? 'win' : held[r].r1 ? '' : 'loss'}">${held[r].r1}</td><td class="c">${held[r].n}</td></tr>`; }).join('') + `</table></div></section>`;
  }

  /* --- trades & waivers --- */
  if (SHOW.moves) {
    const inWin = t => t.leg === W || (W === D.last && t.leg > W);
    const pickLbl = p => `${p.season} ${ord(p.round)}${p.roster_id !== p.previous_owner_id || true ? ` (${name(p.roster_id)}'s)` : ''}`;
    const side = (t, rid) => { const a = Object.entries(t.adds || {}).filter(([, r]) => r === rid).map(([id]) => id);
      const items = a.map(pshort).concat((t.draft_picks || []).filter(p => p.owner_id === rid).map(pickLbl), (t.waiver_budget || []).filter(b => b.receiver === rid).map(b => `$${b.amount} FAAB`));
      let pts = null; if (a.length && t.leg <= W) { pts = 0; for (let w = Math.max(t.leg, D.start); w <= W; w++) a.forEach(id => pts += +(D.ptsW[w] || {})[id] || 0); }
      return { rid, items, pts }; };
    const trades = D.txns.filter(t => t.type === 'trade' && t.leg <= W + 1), nowT = trades.filter(inWin);
    const adds = D.txns.filter(t => (t.type === 'waiver' || t.type === 'free_agent') && Object.keys(t.adds || {}).length).map(t => ({ t, bid: (t.settings && t.settings.waiver_bid) || 0, rid: Object.values(t.adds)[0], pid: Object.keys(t.adds)[0], drop: Object.keys(t.drops || {})[0] }));
    const nowA = adds.filter(a => inWin(a.t)).sort((a, b) => b.bid - a.bid), top = adds.filter(a => a.t.leg <= W + 1).sort((a, b) => b.bid - a.bid)[0];
    const tradeCard = t => { const sd = (t.roster_ids || []).map(r => side(t, r));
      return `<div class="card trade"><span class="tag gold">Trade · Week ${t.leg}</span>${sd.map(s => `<div class="side"><b>${esc(name(s.rid))}</b> <span class="muted">gets</span> ${s.items.length ? esc(s.items.join(', ')) : '<span class="muted">nothing listed</span>'}${s.pts != null ? `<div class="muted" style="font-size:12px">Players received have scored <b class="acc">${f1(s.pts)}</b> since</div>` : ''}</div>`).join('')}</div>`; };
    const budget = (D.league.settings || {}).waiver_budget;
    h += `<section><h2>Trades &amp; Waivers</h2><p class="note">Moves from Week ${W}${W === D.last ? ' and anything since' : ''}. "Scored since" counts every point the players received have put up since the deal, started or not.</p>`;
    h += nowT.length ? `<div class="grid g2">${nowT.map(tradeCard).join('')}</div>` : `<div class="card muted">No trades this week. Somebody make a call.</div>`;
    if (nowA.length) h += `<div class="card" style="margin-top:12px"><div class="lab">Waiver wire${top && top.bid ? ` · biggest bid of the season: $${top.bid} on ${esc(pshort(top.pid))} (${esc(name(top.rid))})` : ''}</div><ul class="plain">${nowA.slice(0, 10).map(a => `<li><b>${esc(name(a.rid))}</b> added ${esc(pname(a.pid))}${a.t.type === 'waiver' ? ` for <b class="gold">$${a.bid}</b>` : ' <span class="muted">(free agent)</span>'}${a.drop ? ` <span class="muted">· dropped ${esc(pshort(a.drop))}</span>` : ''}</li>`).join('')}</ul>${nowA.length > 10 ? `<div class="muted" style="font-size:12px">+ ${nowA.length - 10} more</div>` : ''}</div>`;
    if (budget) h += `<div class="chips">${D.teams.slice().sort((a, b) => a.faabUsed - b.faabUsed).map(t => `<span class="chip">${esc(t.name)} <b class="gold">$${budget - t.faabUsed}</b></span>`).join('')}</div><p class="note" style="margin-top:8px">FAAB remaining.</p>`;
    if (trades.length > nowT.length) h += `<details><summary>Every trade this season (${trades.length}) — and how it's going</summary><div class="grid g2" style="margin-top:12px">${trades.map(tradeCard).join('')}</div></details>`;
    h += `</section>`;
    if (nowT.length) { T.push('🤝 TRADES'); nowT.forEach(t => T.push((t.roster_ids || []).map(r => { const s = side(t, r); return `${name(r)} gets ${s.items.join(', ') || '—'}`; }).join(' | '))); T.push(''); }
    if (nowA.length && nowA[0].bid) T.push(`💸 Biggest waiver bid: ${name(nowA[0].rid)} — $${nowA[0].bid} on ${pshort(nowA[0].pid)}`, '');
  }

  /* --- one manager's trades in KeepTradeCut value --- */
  const tvT = SHOW.tradeValue ? findTeam(qs.get('tt') || CONFIG.tradeTracker) : null;
  if (tvT) {
    h += `<section><h2>${esc(tvT.owner)}'s Trade Ledger <small>${esc(tvT.name)} · KeepTradeCut value</small></h2>`;
    if (!G.players) h += `<div class="card muted">Loading player names…</div>`;
    else {
      const rid = tvT.rid, n = D.teams.length, ns = String(+D.league.season + 1), mpo = D.teams.map(t => t.rid).sort((a, b) => sim[a].maxpf - sim[b].maxpf);
      const tierOf = p => { if (String(p.season) !== ns) return 'Mid'; const i = mpo.indexOf(p.roster_id); return i < 0 ? 'Mid' : i < n / 3 ? 'Early' : i < 2 * n / 3 ? 'Mid' : 'Late'; };
      const rows = D.txns.filter(x => x.type === 'trade' && (x.roster_ids || []).includes(rid) && x.leg <= W + 1).map(x => { const inn = [], out = []; let faab = 0;
        Object.entries(x.adds || {}).forEach(([id, r]) => { if (r === rid) inn.push(playerAsset(id)); });
        Object.entries(x.drops || {}).forEach(([id, r]) => { if (r === rid) out.push(playerAsset(id)); });
        (x.draft_picks || []).forEach(p => { if (p.owner_id === rid && p.previous_owner_id !== rid) inn.push(pickAsset(p, tierOf)); else if (p.previous_owner_id === rid && p.owner_id !== rid) out.push(pickAsset(p, tierOf)); });
        (x.waiver_budget || []).forEach(b => { if (b.receiver === rid) faab += b.amount; if (b.sender === rid) faab -= b.amount; });
        const sum = a => a.reduce((t, y) => t + y.v, 0), vin = sum(inn), vout = sum(out);
        return { x, inn, out, faab, vin, vout, raw: vin - vout, net: ktcEven(inn.map(y => y.v), out.map(y => y.v)), with: (x.roster_ids || []).filter(r => r !== rid) }; });
      const tot = rows.reduce((t, r) => t + r.net, 0), rawTot = rows.reduce((t, r) => t + r.raw, 0), won = rows.filter(r => r.net > 0).length, lost = rows.filter(r => r.net < 0).length;
      const anyMiss = rows.some(r => r.inn.concat(r.out).some(a => a.miss));
      const al = a => a.length ? a.slice().sort((p, q) => q.v - p.v).map(y => `${esc(y.label)} <span class="muted">${y.miss ? 'n/r' : y.v.toLocaleString()}</span>`).join('<br>') : '<span class="muted">—</span>';
      const top = rows.slice().sort((a, b) => b.net - a.net);
      if (!rows.length) h += `<div class="card muted">No trades yet this season.</div>`;
      else h += `<div class="grid g3"><div class="card award"><div class="lab">Net value from trades</div><div class="big ${tot > 0 ? 'win' : tot < 0 ? 'loss' : ''}" style="font-size:44px;font-weight:800">${sgn(tot)}</div><div class="muted">across ${rows.length} trade${rows.length > 1 ? 's' : ''} since the ${esc(D.league.season)} league year opened · ${sgn(rawTot)} before the package premium</div></div>
          <div class="card award"><div class="lab">Trades won / lost on value</div><div class="big" style="font-size:44px;font-weight:800"><span class="win">${won}</span>–<span class="loss">${lost}</span></div><div class="muted">${rows.length - won - lost ? (rows.length - won - lost) + ' even' : 'by today\'s values'}</div></div>
          <div class="card award"><div class="lab">Best / worst deal</div><div class="v"><span class="win">${sgn(top[0].net)}</span> <span class="muted" style="font-size:12px;font-weight:400">with ${esc(top[0].with.map(name).join(', '))}</span></div><div class="v"><span class="loss">${sgn(top[top.length - 1].net)}</span> <span class="muted" style="font-size:12px;font-weight:400">with ${esc(top[top.length - 1].with.map(name).join(', '))}</span></div></div></div>
        <p class="note" style="margin-top:10px">Every asset is priced at today's KeepTradeCut value (${esc(KTC.format)}, snapshot from ${esc(KTC.asOf)}), not its value when the deal was made. <b>Sticker net</b> is the plain sum of what he got minus what he gave. <b>Premium</b> adjusts for the fact that one great player is worth more than several lesser ones adding up to the same number; <b>Net</b> is what the other side would have to add to make the deal even. The premium is an approximation of KeepTradeCut's value adjustment, not their exact formula. ${esc(ns)} picks are priced Early/Mid/Late by where the original team sits in max points-for; later years are priced as Mid. ${esc(String(D.league.season))} rookie picks are priced as the player they became. FAAB is shown but not valued.${anyMiss ? ' "n/r" = outside KeepTradeCut\'s top 500, counted as 0.' : ''}</p>
        <div class="card scroll"><table class="tbl"><tr><th>Date</th><th>With</th><th>Got</th><th>Gave</th><th class="r">Sticker net</th><th class="r">Premium</th><th class="r">Net</th></tr>` +
        rows.map(r => `<tr style="vertical-align:top"><td class="muted" style="white-space:nowrap">${new Date(r.x.created || r.x.status_updated || 0).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</td><td>${esc(r.with.map(name).join(', '))}</td><td>${al(r.inn)}${r.faab > 0 ? `<br><span class="gold">$${r.faab} FAAB</span>` : ''}</td><td>${al(r.out)}${r.faab < 0 ? `<br><span class="gold">$${-r.faab} FAAB</span>` : ''}</td><td class="r muted">${sgn(r.raw)}</td><td class="r ${r.net - r.raw > 0 ? 'win' : r.net - r.raw < 0 ? 'loss' : 'muted'}">${sgn(r.net - r.raw)}</td><td class="r num ${r.net > 0 ? 'win' : r.net < 0 ? 'loss' : ''}">${sgn(r.net)}</td></tr>`).join('') +
        `<tr><td colspan="4"><b>Season total</b></td><td class="r"><b>${sgn(rawTot)}</b></td><td class="r"><b>${sgn(tot - rawTot)}</b></td><td class="r num ${tot > 0 ? 'win' : tot < 0 ? 'loss' : ''}">${sgn(tot)}</td></tr></table></div>`;
      if (rows.length) T.push(`🧾 ${tvT.name} trade ledger: ${sgn(tot)} KTC value across ${rows.length} trades, package premium included (${won} won, ${lost} lost)`, '');
    }
    h += `</section>`;
  }

  /* --- record book --- */
  if (SHOW.recordBook) {
    h += `<section><h2>League Record Book</h2>`;
    if (!H) h += `<div class="card muted">Loading league history…</div>`;
    else {
      const rs = Object.entries(H.rec), fresh = rs.filter(([, r]) => r.isNew && H.prior > 0);
      h += `<p class="note">${H.n.toLocaleString()} regular-season games on record across ${H.seasons} season${H.seasons > 1 ? 's' : ''} (${H.span}).</p><div class="grid g3">${rs.map(([k, r]) => `<div class="card award">${r.isNew && H.prior > 0 ? '<span class="tag hot">New record this week</span>' : ''}<div class="lab">${k}</div><div class="v">${esc(r.txt)}</div><div class="muted">${esc(r.when)}</div></div>`).join('')}</div>`;
      fresh.forEach(([k, r]) => T.push(`🚨 NEW LEAGUE RECORD — ${k}: ${r.txt}`));
    }
    h += `</section>`;
  }

  $('app').innerHTML = h;
  G.text = () => T.map(x => typeof x === 'function' ? x() : x).join('\n').trim();
}

/* ---------------- controls ---------------- */
$('leagueSel').onchange = e => { store.set('recap_league', e.target.value); loadLeague(e.target.value).catch(fail); };
$('weekSel').onchange = e => render(+e.target.value);
$('reBtn').onclick = () => init();
$('copyBtn').onclick = async () => {
  const b = $('copyBtn'), txt = G.text(); if (!txt) return;
  try { await navigator.clipboard.writeText(txt); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  b.textContent = 'Copied ✓'; setTimeout(() => b.textContent = 'Copy text recap', 1500);
};

/* ---------------- sample data (used only if Sleeper can't be reached, or with ?demo) ---------------- */
let DEMOCACHE = null;
function demoApi(path){
  if (!DEMOCACHE) {
    const names = ['Gridiron Goblins','Hail Marys','Sunday Scaries','Waiver Wire Heroes','Bench Mob','End Zone Elite','Fourth & Long','Blitz Brigade','The Audibles','Red Zone Rebels','Two-Minute Thrill','Punt Intended'];
    const n = names.length, str = names.map(() => 105 + gauss() * 12), ids = names.map((_, i) => i + 1), sched = {};
    for (let w = 1; w <= 14; w++) { const r = (w - 1) % (n - 1), arr = [ids[0], ...ids.slice(1).map((_, i) => ids[1 + (i + r) % (n - 1)])]; sched[w] = [];
      for (let i = 0; i < n / 2; i++) sched[w].push([arr[i], arr[n - 1 - i]]); }
    const build = upTo => { const mu = {};
      for (let w = 1; w <= 14; w++) { mu[w] = []; sched[w].forEach((p, mi) => p.forEach(rid => { const pp = {}, all = Array.from({ length: 12 }, (_, k) => 'p' + rid + '_' + k);
        let tot = 0; if (w <= upTo) all.forEach((id, k) => { const v = Math.max(0, Math.round((str[rid - 1] / 9 + gauss() * 6) * 100) / 100); pp[id] = v; if (k < 9) tot += v; });
        mu[w].push({ roster_id: rid, matchup_id: mi + 1, points: Math.round(tot * 100) / 100, players_points: pp, players: all, starters: all.slice(0, 9) }); })); }
      return mu; };
    const players = {}; ids.forEach(rid => { for (let k = 0; k < 12; k++) players['p' + rid + '_' + k] = { full_name: 'Sample Player ' + rid + '-' + (k + 1), position: ['QB','RB','WR','TE'][k % 4], team: 'FA' }; });
    DEMOCACHE = { names, ids, mu: build(4), mu2: build(14), players };
  }
  const c = DEMOCACHE, old = path.includes('demo_prev'); let m;
  const lg = o => ({ league_id: o ? 'demo_prev' : 'demo', name: 'Sample League', season: o ? '2025' : '2026', previous_league_id: o ? null : 'demo_prev',
    roster_positions: ['QB','RB','RB','WR','WR','TE','FLEX','FLEX','SUPER_FLEX','BN','BN','BN'],
    settings: { playoff_teams: 6, playoff_week_start: 15, start_week: 1, last_scored_leg: 4, league_average_match: 1, divisions: 0, draft_rounds: 4, waiver_budget: 100 } });
  if (path === '/state/nfl') return { week: 5, season: '2026', league_season: '2026' };
  if (path === '/players/nfl') return c.players;
  if (/^\/user\/[^/]+$/.test(path)) return { user_id: 'u1' };
  if (/^\/league\/[^/]+$/.test(path)) return lg(old);
  if (/\/leagues\/nfl\//.test(path)) return [lg(false)];
  if (/\/users$/.test(path)) return c.ids.map(i => ({ user_id: 'u' + i, display_name: 'manager' + i, is_owner: i === 1, metadata: { team_name: c.names[i - 1] } }));
  if (/\/rosters$/.test(path)) return c.ids.map(i => ({ roster_id: i, owner_id: 'u' + i, taxi: [], settings: { waiver_budget_used: (i * 13) % 60 } }));
  if (/\/traded_picks$/.test(path)) return [{ season: '2027', round: 1, roster_id: 2, previous_owner_id: 2, owner_id: 1 }];
  if ((m = path.match(/\/transactions\/(\d+)$/))) return +m[1] !== 4 ? [] : [
    { type: 'trade', status: 'complete', leg: 4, roster_ids: [1, 2], adds: { p1_0: 2, p2_1: 1 }, drops: { p1_0: 1, p2_1: 2 }, draft_picks: [{ season: '2027', round: 1, roster_id: 2, previous_owner_id: 2, owner_id: 1 }], waiver_budget: [{ sender: 1, receiver: 2, amount: 10 }], status_updated: 2 },
    { type: 'waiver', status: 'complete', leg: 4, roster_ids: [3], adds: { p5_11: 3 }, drops: { p3_11: 3 }, settings: { waiver_bid: 23 }, status_updated: 1 }];
  if ((m = path.match(/\/matchups\/(\d+)$/))) return (old ? c.mu2 : c.mu)[m[1]] || [];
  throw new Error('demo: unknown path ' + path);
}

init();
